# Configuración de referencia, sin secretos reales.
# @author DarwinG
server:
  port: 8080

spring:
  application:
    name: credits-system

  banner:
    location: classpath:banner.txt

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    jwt:
      secret: ${JWT_SECRET_BASE64}
      expiration: 600000
      issuer: creditos-api
      audience: creditos-web
      clock-skew-seconds: 30

app:
  security:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
    docs-enabled: ${API_DOCS_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${app.security.docs-enabled}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${app.security.docs-enabled}